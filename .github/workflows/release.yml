name: Release

# A version tag (v0.1.0, v0.1.1, ...) runs the full test matrix and the docs
# build; only if all pass does it publish `sextile` to PyPI and deploy the docs
# to GitHub Pages.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml

      - name: Sync third-party dependencies only (no workspace packages)
        run: uv sync --no-install-workspace

      - name: Ruff
        run: uv run --no-project ruff check .

      - name: Mypy (strict)
        run: uv run --no-project mypy

      - name: Build every workspace wheel
        run: uv build --all-packages --out-dir dist/

      - name: Install the wheels
        shell: bash
        run: uv pip install dist/*.whl

      - name: Guard - sextile must import from the wheel, not the source
        run: uv run --no-project python scripts/check-wheel-import.py

      - name: Tests against the installed wheels
        run: uv run --no-project pytest -v

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"
          cache-dependency-glob: |
            pyproject.toml
            packages/*/pyproject.toml

      - name: Sync documentation dependencies (no workspace packages)
        run: uv sync --no-install-workspace --group docs

      - name: Build every workspace wheel
        run: uv build --all-packages --out-dir dist/

      - name: Install the wheels
        shell: bash
        run: uv pip install dist/*.whl

      - name: Guard - sextile must import from the wheel, not the source
        run: uv run --no-project python scripts/check-wheel-import.py

      - name: Build the documentation (warnings are errors)
        run: uv run --no-project sphinx-build -n -W --keep-going -b html docs _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    name: Publish sextile to PyPI
    needs: [test, docs]
    runs-on: ubuntu-latest
    # PyPI trusted publishing needs an OIDC token and a named environment; the
    # environment must be configured as a pending publisher on pypi.org.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.13"

      - name: Refuse a tag that does not match the package version
        run: bash scripts/check-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Build sextile only (sdist + wheel)
        run: |
          rm -rf dist/
          uv build --package sextile --out-dir dist/
          ls -la dist/

      - name: Publish to PyPI via trusted publishing
        # No token: uv reads the OIDC token from GitHub Actions (id-token: write
        # above) and exchanges it with PyPI, which must have a pending publisher
        # registered for this repository, workflow and environment.
        run: uv publish dist/*
        # Fallback to an API token if trusted publishing is unavailable: remove
        # the `environment`/`permissions` above and uncomment the env below.
        # env:
        #   UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  deploy-docs:
    name: Deploy docs to GitHub Pages
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
