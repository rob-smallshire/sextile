[project]
name = "calendar-viewdata"
version = "0.1.0"
description = "A calendar as a Viewdata service, and the framework's worked example"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "sextile",
]

[tool.uv.sources]
sextile = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
