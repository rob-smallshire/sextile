[project]
name = "sextile"
version = "0.4.0"
description = "A framework for Prestel-style Viewdata services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
keywords = ["viewdata", "prestel", "teletext", "videotex", "bbc-micro", "retrocomputing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries",
]
#  Two. Everything a framework for talking to terminals over a socket needs is
#  in the standard library, except two things. anyascii reduces arbitrary
#  Unicode to what a 1974 character set can draw -- a large, specialised subject,
#  and a table written out by hand is a table that is wrong about somebody's
#  alphabet; it is ISC licensed with no dependencies of its own. click is the
#  command-line parser: a service's command line is the framework's plus its
#  own, which composes as Click groups where argparse subparsers are mutated
#  into a parser. See docs/design.md and the decision log.
dependencies = [
    "anyascii>=0.3",
    "click>=8.1",
]

[project.scripts]
sextile = "sextile.__main__:main"

[project.urls]
Homepage = "https://github.com/rob-smallshire/sextile"
Documentation = "https://rob-smallshire.github.io/sextile/"
Repository = "https://github.com/rob-smallshire/sextile"
Issues = "https://github.com/rob-smallshire/sextile/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
