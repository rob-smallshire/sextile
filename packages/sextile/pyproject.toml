[project]
name = "sextile"
version = "0.1.0"
description = "A framework for Prestel-style Viewdata services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
#  None. A framework for talking to terminals over a socket needs nothing but
#  the standard library, and an application is free to bring whatever it needs.
dependencies = []

[project.scripts]
sextile = "sextile.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
