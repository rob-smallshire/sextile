[project]
name = "sextile"
version = "0.1.0"
description = "A Prestel-style Viewdata service presenting the Stardot forum to 1980s Acorn computers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
sextile = "sextile.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
#  Spikes are preserved as a record of how a question was answered, not as
#  maintained code, and they import packages this project does not depend on.
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]
