#  The workspace root. It ships nothing itself: it holds the members, the one
#  lockfile they share, and the tooling they are all held to.
[project]
name = "sextile-workspace"
version = "0.1.0"
description = "Sextile, and the Viewdata services built on it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "sextile",
    "stardot-viewdata",
    "calendar-viewdata",
]

[tool.uv.workspace]
members = ["packages/*"]

#  Members resolve each other from the workspace rather than from an index, so
#  an edit to the framework is felt by its applications immediately.
[tool.uv.sources]
sextile = { workspace = true }
stardot-viewdata = { workspace = true }
calendar-viewdata = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tools"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = [
    "tools",
    "packages/sextile/src",
    "packages/stardot-viewdata/src",
    "packages/calendar-viewdata/src",
]
#  Spikes are preserved as a record of how a question was answered, not as
#  maintained code, and they import packages this project does not depend on.
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["packages", "tools"]
#  Each member's tests are a top-level package of their own, so two members may
#  both have a tests/ directory without one shadowing the other.
explicit_package_bases = true
mypy_path = """\
tools:\
packages/sextile/src:\
packages/stardot-viewdata/src:\
packages/calendar-viewdata/src:\
packages/sextile/tests"""
