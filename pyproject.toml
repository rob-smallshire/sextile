#  The workspace root. It ships nothing itself: it holds the members, the one
#  lockfile they share, and the tooling they are all held to.
[project]
name = "sextile-workspace"
version = "0.1.0"
description = "Sextile, and the Viewdata services built on it"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Smallshire", email = "robert@smallshire.org.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "sextile",
    "stardot-viewdata",
    "calendar-viewdata",
    "weather-viewdata",
]

[tool.uv.workspace]
members = ["packages/*"]

#  Members resolve each other from the workspace rather than from an index, so
#  an edit to the framework is felt by its applications immediately.
[tool.uv.sources]
sextile = { workspace = true }
stardot-viewdata = { workspace = true }
calendar-viewdata = { workspace = true }
weather-viewdata = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["packages", "tools"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = [
    "tools",
    "packages/sextile/src",
    "packages/stardot-viewdata/src",
    "packages/calendar-viewdata/src",
    "packages/weather-viewdata/src",
]
#  Spikes are preserved as a record of how a question was answered, not as
#  maintained code, and they import packages this project does not depend on.
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
#  D102 asks for a docstring on every public method, which here would mostly be
#  a restatement of the signature or of the base class the method overrides.
#  The conventions in CLAUDE.md are against padding of that kind, so a method is
#  documented when it has something to say. D105 and D107 go for the same
#  reason: what a magic method means is fixed by the protocol, and this codebase
#  builds its objects with dataclasses rather than by hand.
ignore = ["D102", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
#  A test says what it is about in its name, and a name needing a docstring to
#  explain it wants rewriting instead. The rules about how a docstring is
#  written still apply to the ones that are there.
"**/tests/**" = ["D1"]
"tools/test_*.py" = ["D1"]

[tool.mypy]
strict = true
files = ["packages", "tools"]
#  Each member's tests are a top-level package of their own, so two members may
#  both have a tests/ directory without one shadowing the other.
explicit_package_bases = true
mypy_path = """\
tools:\
packages/sextile/src:\
packages/stardot-viewdata/src:\
packages/calendar-viewdata/src:\
packages/weather-viewdata/src:\
packages/sextile/tests"""
